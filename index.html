<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روابط</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; text-align: center; background-color: #f4f7f6; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input[type="url"] { width: 90%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background-color: #117852; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0c5b3d; }
        .result-box { margin-top: 20px; padding: 15px; background: #e6f2eb; border-radius: 4px; display: none; word-break: break-all; }
        .copy-btn { background-color: #007bff; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>أداة إنشاء الروابط</h2>
    <p>أدخل الرابط النهائي (مثل: https://www.google.com):</p>
    <input type="url" id="targetUrl" placeholder="https://..." required>
    <br>
    <button onclick="generateAndShorten()">توليد واختصار</button>

    <div id="resultContainer" class="result-box">
        <p>رابط التتبع المختصر:</p>
        <strong id="shortenedUrl"></strong>
        <br>
        <button class="copy-btn" onclick="copyToClipboard()">نسخ الرابط</button>
    </div>
</div>

<script>
   // المسار العام لصفحة التتبع الخاصة بك
    const BASE_URL = "https://serviceio.github.io/go/";

    function generateAndShorten() {
        const inputUrl = document.getElementById('targetUrl').value;
        if (!inputUrl) {
            alert('رجاءً أدخل رابطاً صالحاً أولاً.');
            return;
        }

        // دمج مسار موقعك مع الرابط الهدف
        const fullCombinedUrl = `${BASE_URL}?url=${encodeURIComponent(inputUrl)}`;

        // تعطيل الزر وتغيير النص لتوضيح حالة التحميل
        const btn = document.querySelector('button');
        const originalText = btn.innerText;
        btn.innerText = "جاري الاختصار...";
        btn.disabled = true;

        // 1. إنشاء اسم دالة فريد لكل طلب (لتجنب التداخل)
        const callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());

        // 2. تعريف الدالة التي ستستقبل الاستجابة من is.gd
        window[callbackName] = function(data) {
            // تنظيف الكود بعد الاستخدام
            delete window[callbackName];
            document.body.removeChild(script);

            // إعادة الزر لحالته الطبيعية
            btn.innerText = originalText;
            btn.disabled = false;

            if (data.shorturl) {
                document.getElementById('shortenedUrl').innerText = data.shorturl;
                document.getElementById('resultContainer').style.display = 'block';
            } else {
                alert('خطأ من خدمة الاختصار: ' + (data.errormessage || 'غير معروف'));
            }
        };

        // 3. إنشاء وسم السكربت وطلب البيانات باستخدام تقنية JSONP
        const script = document.createElement('script');
        // نمرر اسم الدالة في معامل callback
        script.src = `https://is.gd/create.php?format=json&url=${encodeURIComponent(fullCombinedUrl)}&callback=${callbackName}`;

        // 4. التعامل مع فشل الاتصال كلياً (مثلاً انقطاع الإنترنت)
        script.onerror = function() {
            delete window[callbackName];
            document.body.removeChild(script);
            btn.innerText = originalText;
            btn.disabled = false;
            alert('تعذر الاتصال بخدمة is.gd نهائياً. تأكد من اتصالك بالإنترنت.');
        };

        // تشغيل الطلب
        document.body.appendChild(script);
    }

    function copyToClipboard() {
        const textToCopy = document.getElementById('shortenedUrl').innerText;
        navigator.clipboard.writeText(textToCopy).then(() => {
            alert('تم نسخ الرابط إلى الحافظة بنجاح!');
        }).catch(err => {
            alert('فشل النسخ التلقائي، يمكنك نسخه يدوياً.');
        });
    }
</script>
</body>
</html>
